rules = [
  OrganizeImports
  RemoveUnused
  DisableSyntax
  RedundantSyntax
]

DisableSyntax {
  noVars = true
  noNulls = true
  noThrows = true
  noWhileLoops = true
  noAsInstanceOf = true
  noIsInstanceOf = true
  noReturns = true
  regex = [
    {
      id = "refineUnsafe"
      pattern = "\\.refineUnsafe\\b"
      message = "refineUnsafe throws on invalid values. Use .from or a safe constructor."
    }
    {
      id = "sysError"
      pattern = "sys\\.error\\b"
      message = "sys.error throws exceptions. Return Either instead."
    }
  ]
}

OrganizeImports {
  targetDialect = Scala3
  groupedImports = Merge
  coalesceToWildcardImportThreshold = 4
  groups = [
    "re:java\\."
    "re:javax\\."
    "scala."
    "*"
  ]
}
